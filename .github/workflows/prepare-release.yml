name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.7 (leave empty to auto-bump patch)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag-release:
    name: Bump version & tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            TARGET_VERSION="${INPUT_VERSION#v}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            if [[ "$CLEAN_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              TARGET_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((${BASH_REMATCH[3]} + 1))"
            else
              TARGET_VERSION="1.0.0"
            fi
          fi

          TAG="v${TARGET_VERSION}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "::error::Tag ${TAG} already exists on the remote."
            exit 1
          fi

          echo "version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        run: |
          git config user.name "Kanso Release Bot"
          git config user.email "github-actions@kanso.local"
          git add package.json
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Summary
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} pushed."
          echo "The Release workflow will now build and publish it: https://github.com/${{ github.repository }}/actions/workflows/release.yml"
