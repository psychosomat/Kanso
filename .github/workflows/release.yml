name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.6)'
        required: true
        type: string

permissions:
  contents: write

env:
  BUN_VERSION: 'latest'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Rebuild better-sqlite3 for Node.js
        run: npm rebuild better-sqlite3

      - name: Test
        run: npx vitest run

  build-linux:
    name: Build Linux
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot libarchive-tools zstd libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Build Linux packages
        run: bunx electron-builder --linux deb pacman tar.gz AppImage

      - name: Normalize AppImage extension
        run: |
          for f in release/*.AppImage; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.AppImage}.appimage"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: lint-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('build-resources/windows-thumbnail-provider/*.csproj') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Build Windows thumbnail provider
        run: bun run build:thumbnail:win

      - name: Build Windows installer
        run: bunx electron-builder --win nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS (arm64)
    needs: lint-test
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: macos-arm64-bun-${{ hashFiles('bun.lock') }}
          restore-keys: macos-arm64-bun-

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-arm64-electron-${{ hashFiles('bun.lock') }}

      - name: Restore Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build-resources/macos-quicklook/build/DerivedData
          key: macos-arm64-xcode-derived-data-${{ hashFiles('build-resources/macos-quicklook/**/*.swift', 'build-resources/macos-quicklook/**/*.pbxproj') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Build macOS thumbnail provider
        run: bun run build:thumbnail:mac

      - name: Build macOS packages (arm64)
        run: bunx electron-builder --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: release/*
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS (x64)
    needs: lint-test
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: macos-x64-bun-${{ hashFiles('bun.lock') }}
          restore-keys: macos-x64-bun-

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-x64-electron-${{ hashFiles('bun.lock') }}

      - name: Restore Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: build-resources/macos-quicklook/build/DerivedData
          key: macos-x64-xcode-derived-data-${{ hashFiles('build-resources/macos-quicklook/**/*.swift', 'build-resources/macos-quicklook/**/*.pbxproj') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Build macOS thumbnail provider
        run: bun run build:thumbnail:mac

      - name: Build macOS packages (x64)
        run: bunx electron-builder --mac --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - lint-test
      - build-linux
      - build-windows
      - build-macos-arm64
      - build-macos-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-artifacts'
          merge-multiple: true

      - name: List release artifacts
        run: ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kanso ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          files: release/*

  publish-aur:
    name: Publish AUR package
    needs: publish-release
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: kanso-bin
      AUR_REPO_URL: aur@aur.archlinux.org:kanso-bin.git
      OUT_DIR: packaging/aur
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release

      - name: Compute tarball SHA256
        id: sha
        run: |
          sha=$(sha256sum release/Kanso-*-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup SSH for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Add AUR to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Render AUR packaging files
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          VERSION=${VERSION#v}
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Kanso-${VERSION}-linux-x64.tar.gz"
          LOGO_URL="https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/public/logo512.png"

          mkdir -p "$OUT_DIR"

          cat > "${OUT_DIR}/PKGBUILD" <<EOF
          pkgname=${PACKAGE_NAME}
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Modern media player focused on convenience, beauty, and performance"
          arch=("x86_64")
          url="https://github.com/${{ github.repository }}"
          license=("MIT")
          depends=(
            "gtk3"
            "libsecret"
            "nss"
            "alsa-lib"
          )
          optdepends=(
            "ffmpeg: broader codec support from the system stack"
          )
          provides=("kanso")
          conflicts=("kanso")
          source_x86_64=("kanso-\${pkgver}.tar.gz::${SOURCE_URL}"
                     "logo512.png::${LOGO_URL}")
          sha256sums_x86_64=("${SOURCE_SHA}"
                       "SKIP")

          package() {
            install -dm755 "\${pkgdir}/opt/kanso"
            cp -a "\${srcdir}/Kanso-\${pkgver}-linux-x64/"* "\${pkgdir}/opt/kanso/"

            install -dm755 "\${pkgdir}/usr/bin"
            ln -sf "/opt/kanso/kanso" "\${pkgdir}/usr/bin/kanso"

            install -Dm644 "\${srcdir}/logo512.png" \\
              "\${pkgdir}/usr/share/pixmaps/kanso.png"

            install -Dm644 /dev/stdin "\${pkgdir}/usr/share/applications/kanso.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Kanso
          Exec=/usr/bin/kanso %U
          Terminal=false
          Type=Application
          Icon=kanso
          StartupWMClass=Kanso
          Categories=AudioVideo;Video;
          MimeType=video/mp4;video/x-matroska;video/webm;video/quicktime;video/x-msvideo;video/x-m4v;video/mp2t;
          DESKTOP
          }
          EOF

          cat > "${OUT_DIR}/.SRCINFO" <<EOF
          pkgbase = ${PACKAGE_NAME}
          	pkgdesc = Modern media player focused on convenience, beauty, and performance
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://github.com/${{ github.repository }}
          	arch = x86_64
          	license = MIT
          	depends = gtk3
          	depends = libsecret
          	depends = nss
          	depends = alsa-lib
          	optdepends = ffmpeg: broader codec support from the system stack
          	provides = kanso
          	conflicts = kanso
          	source_x86_64 = kanso-${VERSION}.tar.gz::${SOURCE_URL}
          	source_x86_64 = logo512.png::${LOGO_URL}
          	sha256sums_x86_64 = ${SOURCE_SHA}
          	sha256sums_x86_64 = SKIP

          pkgname = ${PACKAGE_NAME}
          EOF

      - name: Commit updated AUR packaging files to main
        run: |
          git config user.name "Kanso Release Bot"
          git config user.email "github-actions@kanso.local"
          git checkout main
          git add "${OUT_DIR}/PKGBUILD" "${OUT_DIR}/.SRCINFO"
          if git diff --cached --quiet; then
            echo "No AUR packaging changes to commit."
          else
            git commit -m "chore(aur): update kanso-bin packaging for ${{ env.RELEASE_TAG }}"
            git push origin main
          fi

      - name: Publish to AUR
        run: |
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          git clone "$AUR_REPO_URL" "$WORKDIR/kanso-bin"
          cp "${OUT_DIR}/PKGBUILD" "${OUT_DIR}/.SRCINFO" "$WORKDIR/kanso-bin/"

          cd "$WORKDIR/kanso-bin"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package already up to date for ${{ env.RELEASE_TAG }}."
            exit 0
          fi

          git -c user.email="github-actions@kanso.local" -c user.name="Kanso Release Bot" \
            commit -m "Release ${{ env.RELEASE_TAG }}"
          git push
