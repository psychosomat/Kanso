<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Kanso — a player where there is nothing extra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="0.55" stop-color="#17181b"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f76f53" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f76f53" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f8cf5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6f8cf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="120" cy="-30" rx="560" ry="380" fill="url(#ember)"/>
  <ellipse cx="1090" cy="430" rx="560" ry="380" fill="url(#indigo)"/>

  <circle cx="600" cy="200" r="190" fill="none" stroke="#f76f53" stroke-opacity="0.12" stroke-width="2"
          stroke-dasharray="1000 194" stroke-linecap="round" transform="rotate(-38 600 200)"/>

  <text x="600" y="212" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="110" font-weight="600" letter-spacing="10" fill="#f2efe6">KANSO</text>

  <text x="600" y="262" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="4" fill="#9b9a92">A PLAYER WHERE THERE IS NOTHING EXTRA</text>
</svg>
